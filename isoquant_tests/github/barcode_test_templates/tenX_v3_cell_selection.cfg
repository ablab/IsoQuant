# 10x Genomics Single Cell v3 with cell barcodes detected from read counts
# Use this when the whitelist is a stock 10x list (737K / 3M+), where per-read
# whitelist matching degenerates into exact matching.
# Tab-separated key-value format

# Test identification
name	TENX.V3.CELLSEL.TEST1
output	/path/to/output

run_type	single

# Input data
reads	/path/to/simulated_reads.fq.gz
barcodes	/path/to/3M-3pgex-may-2023.txt

mode	tenX_v3

threads	16

qa_mode	tenX_v3

# Setting --n_cells makes the whitelist a pool to select cell barcodes from rather
# than the cell list itself. Use "auto" to estimate the count from the data.
# See .claude/CELL_BARCODE_SELECTION.md
detect_options	"--split_molecules false --n_cells 5000"

# Etalon file for comparison (optional)
# etalon	TENX.V3.CELLSEL.TEST1.etl
