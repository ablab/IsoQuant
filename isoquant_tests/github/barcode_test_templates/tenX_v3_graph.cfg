# 10x Genomics Single Cell v3 with graph-based barcode correction
# Use this when the whitelist is a stock 10x list (737K / 3M+), where per-read
# whitelist matching degenerates into exact matching.
# Tab-separated key-value format

# Test identification
name	TENX.V3.GRAPH.TEST1
output	/path/to/output

run_type	single

# Input data
reads	/path/to/simulated_reads.fq.gz
barcodes	/path/to/3M-3pgex-may-2023.txt

mode	tenX_v3

threads	16

qa_mode	tenX_v3

# Graph-based correction. --n_cells is the expected number of cell-associated
# barcodes; omit it to have it estimated from the barcode count distribution.
# See .claude/BARCODE_GRAPH_CORRECTION.md
detect_options	"--barcode_correction graph --n_cells 5000"

# Etalon file for comparison (optional)
# etalon	TENX.V3.GRAPH.TEST1.etl
