name: User manual

# The manual is built from the latest release tag, not from master, so it always
# matches the released version. To publish documentation fixes for the current
# release, move its tag onto the fixing commit (git tag -f vX.Y.Z && git push -f origin vX.Y.Z);
# the uploaded release archive is unaffected.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "tag/branch to build the manual from (default: latest release tag)"
        required: false
        default: ""
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve documentation ref
        run: |
          ref="${{ github.event.inputs.ref }}"
          if [ -z "$ref" ]; then
            ref=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          fi
          echo "Building manual from $ref"
          echo "DOCS_REF=$ref" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DOCS_REF }}
          fetch-depth: 0
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material mkdocs-macros-plugin
      - run: mkdocs gh-deploy --force
