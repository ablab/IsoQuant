# R10.4 cDNA chemistry, 5000 cells, stock-sized whitelist, graph correction.
name: Mouse.10x.5k.R10.4.stock_whitelist.graph
output: /abga/work/andreyp/ci_isoquant/output
run_type: single
reads: Mouse.10x.5k.ONT_cDNA.R10.4.no_trunc.bam
