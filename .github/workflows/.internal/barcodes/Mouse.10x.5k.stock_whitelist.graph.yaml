# Graph-based barcode correction against a stock-sized whitelist.
# Same reads as Mouse.10x.5k.no_truncation.ONT_Stereo, but the whitelist is the 7.4M
# 3pgex list with the 5000 simulated cell barcodes prepended -- i.e. what a user gets
# when they pass the stock 10x whitelist instead of a short-read-derived one.
name: Mouse.10x.5k.stock_whitelist.graph
output: /abga/work/andreyp/ci_isoquant/output
run_type: single
reads: Mouse.10x.5k.no_truncation.NewStereoQ.600k.fq.gz
barcodes: /abga/work/andreyp/ci_isoquant/data/barcodes/10x.stocklike_7.4M.txt
mode: tenX_v3
threads: '16'
qa_mode: tenX_v3
detect_options: "--barcode_correction graph --n_cells 5000"
baselines:
  barcode:
    barcoded_reads: 520130.0
    correct_barcodes: 519312.0
    precision: 99.84
    recall: 86.55
    total_reads: 600000.0
