name: Resume option tests

on:
  workflow_dispatch:
  schedule:
  - cron: '0 6 * * 2,5'

env:
  RUN_NAME: Resume_tests
  LAUNCHER: ${{github.workspace}}/isoquant_tests/github/run_pipeline.py
  CFG_DIR: ${{github.workspace}}/isoquant_tests/github/configs
  BIN_PATH: /abga/work/andreyp/ci_isoquant/bin/
  OUTPUT_BASE: /abga/work/andreyp/ci_isoquant/output/${{github.ref_name}}/

concurrency:
  group: ${{github.workflow}}
  cancel-in-progress: false

jobs:
  launch-runner:
    runs-on:
      labels: [isoquant]
    name: 'Running IsoQuant and QC'

    steps:
      - name: 'Cleanup'
        run: >
          set -e &&
          shopt -s dotglob &&
          rm -rf *

      - name: 'Checkout'
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: 'Resume in read collection'
        if: always()
        shell: bash
        env:
          STEP_NAME: RESUME1.SIRVs.R10
        run: |
          export PATH=$PATH:${{env.BIN_PATH}}
          python3 ${{env.LAUNCHER}} ${{env.CFG_DIR}}/${{env.STEP_NAME}}.yaml -o ${{env.OUTPUT_BASE}}

      - name: 'Resume in model construction'
        if: always()
        shell: bash
        env:
          STEP_NAME: RESUME2.SIRVs.R10
        run: |
          export PATH=$PATH:${{env.BIN_PATH}}
          python3 ${{env.LAUNCHER}} ${{env.CFG_DIR}}/${{env.STEP_NAME}}.yaml -o ${{env.OUTPUT_BASE}}

      - name: 'Resume after read collection'
        if: always()
        shell: bash
        env:
          STEP_NAME: RESUME3.SIRVs.R10
        run: |
          export PATH=$PATH:${{env.BIN_PATH}}
          python3 ${{env.LAUNCHER}} ${{env.CFG_DIR}}/${{env.STEP_NAME}}.yaml -o ${{env.OUTPUT_BASE}}

      - name: 'Resume in model construction with additional options'
        if: always()
        shell: bash
        env:
          STEP_NAME: RESUME4.SIRVs.R10
        run: |
          export PATH=$PATH:${{env.BIN_PATH}}
          python3 ${{env.LAUNCHER}} ${{env.CFG_DIR}}/${{env.STEP_NAME}}.yaml -o ${{env.OUTPUT_BASE}}

      - name: 'Resume in read collection with 2 files'
        if: always()
        shell: bash
        env:
          STEP_NAME: RESUME_GR1.SIRVs.R10
        run: |
          export PATH=$PATH:${{env.BIN_PATH}}
          python3 ${{env.LAUNCHER}} ${{env.CFG_DIR}}/${{env.STEP_NAME}}.yaml -o ${{env.OUTPUT_BASE}}

      - name: 'Resume in read collection with TSV groups'
        if: always()
        shell: bash
        env:
          STEP_NAME: RESUME_GR2.SIRVs.R10
        run: |
          export PATH=$PATH:${{env.BIN_PATH}}
          python3 ${{env.LAUNCHER}} ${{env.CFG_DIR}}/${{env.STEP_NAME}}.yaml -o ${{env.OUTPUT_BASE}}

      - name: 'Single-cell reference run (no resume)'
        if: always()
        shell: bash
        env:
          STEP_NAME: SC.Mouse.10x.4chr.allinfo
        run: |
          export PATH=$PATH:${{env.BIN_PATH}}
          python3 ${{env.LAUNCHER}} ${{env.CFG_DIR}}/${{env.STEP_NAME}}.yaml -o ${{env.OUTPUT_BASE}}

      - name: 'Single-cell 2-experiment reference run (no resume)'
        if: always()
        shell: bash
        env:
          STEP_NAME: SC.Mouse.10x.4chr.2samples.allinfo
        run: |
          export PATH=$PATH:${{env.BIN_PATH}}
          python3 ${{env.LAUNCHER}} ${{env.CFG_DIR}}/${{env.STEP_NAME}}.yaml -o ${{env.OUTPUT_BASE}}

      - name: 'SC: resume in barcode calling'
        if: always()
        shell: bash
        env:
          STEP_NAME: RESUME_SC1.Mouse.10x
        run: |
          export PATH=$PATH:${{env.BIN_PATH}}
          python3 ${{env.LAUNCHER}} ${{env.CFG_DIR}}/${{env.STEP_NAME}}.yaml -o ${{env.OUTPUT_BASE}}

      - name: 'SC: resume while writing the tagged BAM'
        if: always()
        shell: bash
        env:
          STEP_NAME: RESUME_SC2.Mouse.10x
        run: |
          export PATH=$PATH:${{env.BIN_PATH}}
          python3 ${{env.LAUNCHER}} ${{env.CFG_DIR}}/${{env.STEP_NAME}}.yaml -o ${{env.OUTPUT_BASE}}

      - name: 'SC: resume in read collection'
        if: always()
        shell: bash
        env:
          STEP_NAME: RESUME_SC3.Mouse.10x
        run: |
          export PATH=$PATH:${{env.BIN_PATH}}
          python3 ${{env.LAUNCHER}} ${{env.CFG_DIR}}/${{env.STEP_NAME}}.yaml -o ${{env.OUTPUT_BASE}}

      - name: 'SC: resume before multimapper resolution'
        if: always()
        shell: bash
        env:
          STEP_NAME: RESUME_SC4.Mouse.10x
        run: |
          export PATH=$PATH:${{env.BIN_PATH}}
          python3 ${{env.LAUNCHER}} ${{env.CFG_DIR}}/${{env.STEP_NAME}}.yaml -o ${{env.OUTPUT_BASE}}

      - name: 'SC: resume in UMI filtering'
        if: always()
        shell: bash
        env:
          STEP_NAME: RESUME_SC5.Mouse.10x
        run: |
          export PATH=$PATH:${{env.BIN_PATH}}
          python3 ${{env.LAUNCHER}} ${{env.CFG_DIR}}/${{env.STEP_NAME}}.yaml -o ${{env.OUTPUT_BASE}}

      - name: 'SC: resume while writing the deduplicated BAM'
        if: always()
        shell: bash
        env:
          STEP_NAME: RESUME_SC6.Mouse.10x
        run: |
          export PATH=$PATH:${{env.BIN_PATH}}
          python3 ${{env.LAUNCHER}} ${{env.CFG_DIR}}/${{env.STEP_NAME}}.yaml -o ${{env.OUTPUT_BASE}}

      - name: 'SC: resume in assignment processing'
        if: always()
        shell: bash
        env:
          STEP_NAME: RESUME_SC7.Mouse.10x
        run: |
          export PATH=$PATH:${{env.BIN_PATH}}
          python3 ${{env.LAUNCHER}} ${{env.CFG_DIR}}/${{env.STEP_NAME}}.yaml -o ${{env.OUTPUT_BASE}}

      - name: 'SC: resume in the merge'
        if: always()
        shell: bash
        env:
          STEP_NAME: RESUME_SC8.Mouse.10x
        run: |
          export PATH=$PATH:${{env.BIN_PATH}}
          python3 ${{env.LAUNCHER}} ${{env.CFG_DIR}}/${{env.STEP_NAME}}.yaml -o ${{env.OUTPUT_BASE}}

      - name: 'SC: resume before cleanup'
        if: always()
        shell: bash
        env:
          STEP_NAME: RESUME_SC9.Mouse.10x
        run: |
          export PATH=$PATH:${{env.BIN_PATH}}
          python3 ${{env.LAUNCHER}} ${{env.CFG_DIR}}/${{env.STEP_NAME}}.yaml -o ${{env.OUTPUT_BASE}}

      - name: 'SC: resume a finished run'
        if: always()
        shell: bash
        env:
          STEP_NAME: RESUME_SC10.Mouse.10x
        run: |
          export PATH=$PATH:${{env.BIN_PATH}}
          python3 ${{env.LAUNCHER}} ${{env.CFG_DIR}}/${{env.STEP_NAME}}.yaml -o ${{env.OUTPUT_BASE}}

      - name: 'SC: resume the second of two experiments'
        if: always()
        shell: bash
        env:
          STEP_NAME: RESUME_SC_2S.Mouse.10x
        run: |
          export PATH=$PATH:${{env.BIN_PATH}}
          python3 ${{env.LAUNCHER}} ${{env.CFG_DIR}}/${{env.STEP_NAME}}.yaml -o ${{env.OUTPUT_BASE}}
