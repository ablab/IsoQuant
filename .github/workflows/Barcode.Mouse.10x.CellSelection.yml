name: Barcode Mouse 10x Cell Selection

on:
  workflow_dispatch:
  schedule:
  - cron: '0 3 * * 6'

env:
  LAUNCHER: ${{github.workspace}}/isoquant_tests/github/run_barcode_test.py
  CFG_DIR: ${{github.workspace}}/isoquant_tests/github/configs/barcodes
  BIN_PATH: /abga/work/andreyp/ci_isoquant/bin/
  OUTPUT_BASE: /abga/work/andreyp/ci_isoquant/output/${{github.ref_name}}/barcodes/

concurrency:
  group: ${{github.workflow}}
  cancel-in-progress: false

jobs:
  check-changes:
    runs-on:
      labels: [isoquant]
    name: 'Check for recent changes'
    outputs:
      has_changes: ${{steps.check.outputs.has_changes}}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 'Check for commits in last 7 days'
        id: check
        run: |
          # Always run on manual trigger
          if [ "${{github.event_name}}" = "workflow_dispatch" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Check for commits in last 7 days
          COMMITS=$(git log --oneline --since="7 days ago" | wc -l)
          if [ "$COMMITS" -gt 0 ]; then
            echo "Found $COMMITS commits in last 7 days"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No commits in last 7 days, skipping"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  launch-runner:
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on:
      labels: [isoquant]
    name: 'Running cell barcode detection QC'

    steps:
      - name: 'Cleanup'
        run: >
          set -e &&
          shopt -s dotglob &&
          rm -rf *

      - name: 'Checkout'
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      # 5000 simulated cells, reads called against a 7.4M stock-sized whitelist.
      # Per-read whitelist matching degenerates into exact matching at this whitelist size,
      # so this step is the baseline the detection step has to beat.
      - name: 'Mouse 10x 5k, stock whitelist, per-read matching'
        if: always()
        shell: bash
        env:
          STEP_NAME: Mouse.10x.5k.stock_whitelist
        run: |
          export PATH=$PATH:${{env.BIN_PATH}}
          python3 ${{env.LAUNCHER}} ${{env.CFG_DIR}}/${{env.STEP_NAME}}.yaml -o ${{env.OUTPUT_BASE}}

      - name: 'Mouse 10x 5k, stock whitelist, detected cell barcodes'
        if: always()
        shell: bash
        env:
          STEP_NAME: Mouse.10x.5k.stock_whitelist.detected
        run: |
          export PATH=$PATH:${{env.BIN_PATH}}
          python3 ${{env.LAUNCHER}} ${{env.CFG_DIR}}/${{env.STEP_NAME}}.yaml -o ${{env.OUTPUT_BASE}}

      # Guards the split-mode path: pass 1 accepts every barcode window, so wrong-strand
      # duplicates would surface here as inflated molecule counts.
      - name: 'Mouse 10x concat (split), stock whitelist, detected cell barcodes'
        if: always()
        shell: bash
        env:
          STEP_NAME: Mouse.10x_concat.realistic.stock_whitelist.detected
        run: |
          export PATH=$PATH:${{env.BIN_PATH}}
          python3 ${{env.LAUNCHER}} ${{env.CFG_DIR}}/${{env.STEP_NAME}}.yaml -o ${{env.OUTPUT_BASE}}
